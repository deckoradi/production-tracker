<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Tracker - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🏭 Production Tracker</h1>
            <h2>Prijava</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Korisničko ime:</label>
                    <input type="text" id="username" placeholder="Unesite korisničko ime" required>
                </div>
                <div class="form-group">
                    <label for="password">Lozinka:</label>
                    <input type="password" id="password" placeholder="Unesite lozinku" required>
                </div>
                <button type="submit" class="btn-primary">Prijavi se</button>
                <div id="loginError" class="error-message"></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
