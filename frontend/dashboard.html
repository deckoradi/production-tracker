<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Production Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Production Tracker">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="dashboard">
        <nav class="navbar">
            <div class="nav-left">
                <h1>🏭 Tracker</h1>
                <span id="companyDisplay" class="company-badge"></span>
            </div>
            <div class="nav-right">
                <button id="sendReportBtn" class="btn-success" style="padding:6px 12px;font-size:12px;">📧 Izveštaj</button>
                <button id="logoutBtn" class="btn-secondary" style="padding:6px 12px;font-size:12px;">Odjava</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <!-- Admin Panel -->
            <div id="adminPanel" class="panel hidden">
                <div class="panel-header">
                    <h2>⚙️ Admin</h2>
                </div>
                <div class="panel-body">
                    <!-- Upload -->
                    <div class="admin-section">
                        <h3>📤 Upload Excel</h3>
                        <form id="uploadForm" class="upload-form">
                            <input type="file" id="fileInput" accept=".xlsx,.xls">
                            <button type="submit" class="btn-primary">Upload</button>
                        </form>
                        <div id="uploadStatus"></div>
                    </div>

                    <!-- Novi korisnik -->
                    <div class="admin-section">
                        <h3>👤 Novi korisnik</h3>
                        <form id="createUserForm" class="user-form">
                            <input type="text" id="newUsername" placeholder="Korisničko ime" required>
                            <input type="text" id="newCompany" placeholder="Naziv firme" required>
                            <button type="submit" class="btn-primary">Kreiraj</button>
                        </form>
                        <div id="userStatus"></div>
                    </div>

                    <!-- Lista korisnika -->
                    <div class="admin-section">
                        <h3>📋 Korisnici</h3>
                        <div id="usersList"></div>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <div class="panel">
                <div class="panel-header">
                    <h2>🔍 Pretraga</h2>
                </div>
                <div class="panel-body">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Firma, šifra, nalog..." autocomplete="off">
                        <button id="searchBtn" class="btn-primary">🔍</button>
                        <button id="clearSearchBtn" class="btn-secondary">✖</button>
                    </div>
                </div>
            </div>

            <!-- Orders -->
            <div class="panel">
                <div class="panel-header">
                    <h2>📦 Nalozi</h2>
                    <span id="orderCount" style="font-size:12px;color:#718096;"></span>
                </div>
                <div class="panel-body">
                    <div id="ordersContainer">
                        <div class="loading">⏳ Učitavanje...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal za faze -->
    <div id="phaseModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 style="font-size:18px;"><span id="modalOrderNumber"></span></h2>
            <div id="modalOrderInfo" class="order-info"></div>
            <div id="phasesContainer" class="phases-grid"></div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
